spring.application.name=sandboxpro
server.port=8069

# Database Configuration (Environment variables with defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-50cedc9-priyasinghh2018-f25a.b.aivencloud.com:18748/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=${JWT_SECRET:campusPlacementPortalSecretKey2026VeryLongSecureKey123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# File upload storage
app.upload.dir=${UPLOAD_DIR:uploads/resumes}